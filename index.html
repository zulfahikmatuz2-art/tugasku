
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Pertamaku</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            text-align: center;
            padding: 50px;
        }

        .kotak {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: auto;
        }

        h1 {
            color: blue;
        }

        button {
            background: blue;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="kotak">
        <h1>Selamat Datang!</h1>

        <p>Ini adalah website HTML pertama saya.</p>

        <button onclick="salam()">
            Klik Saya
        </button>
    </div>

    <script>
        function salam() {
            alert("Halo! Selamat belajar HTML.");
        }
    </script>

</body>
</html>
